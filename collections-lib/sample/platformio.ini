; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_ldf_mode = deep
lib_deps =
	HC-LIB.System=symlink://../../system-lib
	HC-LIB.Collections=symlink://../../collections-lib

[env:nano-board]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_speed = 115200
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
test_port = COM3
test_speed = 115200
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}

[env:desktop]
platform = native
build_type = test
build_flags = 
	-fexceptions
	-std=gnu++11
	-Iinclude
build_unflags = -fno-exceptions
test_build_src = no
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
	${common.lib_deps}
	Unity @^2.5.2

[env:desktop-debug]
platform = native
build_type = test
debug_test = *
build_flags = 
	-fexceptions
	-std=gnu++11
	-Iinclude
	-O0 -ggdb3 -g3
build_unflags = -fno-exceptions
debug_build_flags = -O0 -ggdb3 -g3
test_build_src = no
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps =
	${common.lib_deps}
	Unity @^2.5.2