; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = nano-board

[common]
lib_ldf_mode = deep+
lib_deps =
	HC-LIB.Logger=file://../../../packages/HC-LIB.Logger-1.0.2609.tar.gz
	
[env:nano-board]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_speed = 115200
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_ldf_mode = ${common.lib_ldf_mode}
; HardwareSerial defaults to 64-byte RX and TX rings (~128 B SRAM plus the
; Serial object). This demo only prints short lines, so smaller rings free RAM.
build_flags =
	-DSERIAL_RX_BUFFER_SIZE=16
	-DSERIAL_TX_BUFFER_SIZE=32
lib_deps =
	${common.lib_deps}

; Native x86/x64: pio run -e desktop
; Run: .pio/build/desktop/program.exe  (Ctrl+C to stop)
[env:desktop]
platform = native
build_type = release
build_flags =
	-fexceptions
	-std=gnu++11
	-Isrc
build_unflags = -fno-exceptions
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}

[env:desktop-debug]
platform = native
build_type = debug
build_flags =
	-fexceptions
	-std=gnu++11
	-Isrc
	-O0 -ggdb3 -g3
build_unflags = -fno-exceptions
debug_build_flags = -O0 -ggdb3 -g3
lib_ldf_mode = ${common.lib_ldf_mode}
lib_deps = ${common.lib_deps}
