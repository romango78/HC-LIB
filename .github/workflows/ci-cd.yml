name: PlatformIO CI

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy CI-CD host
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest version
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Enable caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.cashe/pip
            ~/.platformio/.cache
          key: ${{runner.os}}-pio
      - name: Deploy Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Execute tests
        run: |
          # Initialize variables
          testcount=0
          failedcount=0
          ignoredcount=0
          projectcount=0
          projectfailed=0
          for file in $(find . -name "test" -type f -print); do
            # Get the parent directory of the current file
            folder="$(dirname "$file")"    
            # Check if the parent directory does not contain ".pio"
            if [[ "$folder" != *".pio"* ]]; then
              echo "$folder"
            fi
          done
    
